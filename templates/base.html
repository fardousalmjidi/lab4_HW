<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}نظام إدارة القهوة{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background-color: #f7f3f0; color: #4e3629; }
        
        /* شريط التطبيق العلوي (Navbar) */
        .navbar { background-color: #5c4033; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; }
        .navbar h2 { font-size: 20px; }
        .navbar-links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .navbar-links a, .navbar-links button { color: #f7f3f0; text-decoration: none; background: #6f4e37; padding: 8px 15px; border-radius: 5px; font-size: 14px; border: none; cursor: pointer; font-family: Tahoma, sans-serif; transition: background 0.3s; display: inline-flex; align-items: center; }
        .navbar-links a:hover, .navbar-links button:hover { background: #8d6e63; }
        .user-welcome { font-size: 14px; color: #d7ccc8; margin-left: 10px; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        
        /* الهيدر الرئيسي */
        .header { background: #6f4e37; color: white; padding: 25px; border-radius: 10px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header h1 { font-size: 24px; }

        /* تنسيق نموذج البحث والفلتر */
        .filter-form { background: white; padding: 20px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 10px; justify-content: center; }
        .filter-form input { padding: 12px; width: 65%; border: 1px solid #d7ccc8; border-radius: 6px; font-family: Tahoma, sans-serif; outline: none; font-size: 14px; }
        .filter-form button { padding: 12px 25px; background-color: #6f4e37; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: Tahoma, sans-serif; font-size: 14px; transition: background 0.3s; }
        .filter-form button:hover { background-color: #5c4033; }
        .reset-btn { background-color: #a1887f !important; text-decoration: none; display: inline-flex; align-items: center; }

        /* بطاقات عرض القهوة */
        .coffee-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border-right: 6px solid #c8ad7f; transition: transform 0.2s; }
        .coffee-card:hover { transform: translateY(-2px); }
        .coffee-info h3 { margin-bottom: 8px; color: #5c4033; }
        .coffee-info p { color: #795548; font-size: 14px; }
        .badge { background: #c8ad7f; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .price { font-weight: bold; color: #27ae60; font-size: 20px; background: #e8f5e9; padding: 8px 15px; border-radius: 8px; }
        
        .empty-msg { text-align: center; color: #8d6e63; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-size: 16px; }
        .coffee-footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background-color: #5c4033;
            color: #f7f3f0;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- شريط تنقل تطبيقي علوي ثابت -->
    <div class="navbar">
        <h2>☕ نظام إدارة القهوة</h2>
        <div class="navbar-links">
            <a href="{% url 'coffee_list' %}">🏠 الرئيسية</a>
            <a href="{% url 'view_cart' %}">🛒 عربة التسوق</a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">⚙️ لوحة التحكم</a>
                <span class="user-welcome">مرحباً، {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" style="background-color: #b71c1c;">🚪 تسجيل خروج</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">🔐 تسجيل الدخول</a>
                <a href="{% url 'register' %}">📝 إنشاء حساب</a>
            {% endif %}
        </div>
    </div>

    <!-- المحتوى المتغير للصفحات -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
