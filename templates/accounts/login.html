<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - نظام القهوة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #fdfbf7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(111, 78, 55, 0.1); width: 350px; text-align: center; border-top: 4px solid #6f4e37; }
        h2 { color: #6f4e37; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #d7ccc8; border-radius: 6px; box-sizing: border-box; }
        button { background: #6f4e37; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #5c3a21; }
    </style>
</head>
<body>
    <div class="card">
        <h2>تسجيل الدخول للنظام</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
    </div>
</body>
</html>
